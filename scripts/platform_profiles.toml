conditional_native_components = ["hwcodec:ffmpeg"]
native_marker = "android-elf-arm64"
minimum_os = "api-24"
packaging = "gradle-apk"
wrappers = ["flutter/ndk_arm64.sh"]
gates = ["config", "compile", "unit", "artifact", "device"]

[profiles.feature_requires]
