schema_version = 1
cargo_default_features = ["use_dasp", "quic-transport"]

shipping_wrappers = [
  "flutter/build_android.sh",
  "flutter/ndk_arm64.sh",
  "flutter/ndk_arm.sh",
  "flutter/ndk_x64.sh",
  "flutter/ndk_x86.sh",
  "flutter/build_ios.sh",
  "flutter/build_ios_sim.sh",
  "flutter/ios_arm64.sh",
  "flutter/ios_sim_arm64.sh",
  "flutter/ios_x64.sh",
  "scripts/build_macos.sh",
  "scripts/build_windows.ps1",
  "scripts/build_linux.sh",
]

[[profiles]]
id = "android-release-package"
platform = "android"
rust_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
artifact = "package"
roles = ["controller", "controlled-host"]
default_features = true
required_features = ["flutter"]
optional_features = ["hwcodec", "mediacodec"]
forbidden_features = ["vram", "linux-pkg-config", "screencapturekit", "unix-file-copy-paste"]
native_components = ["libyuv", "libvpx", "aom", "opus", "ndk-compat"]
conditional_native_components = ["hwcodec:ffmpeg"]
native_marker = "android-multi-abi"
minimum_os = "api-24"
packaging = "gradle-apk-aab"
wrappers = ["flutter/build_android.sh"]
gates = ["config", "compile", "unit", "artifact", "device"]

[profiles.feature_requires]
hwcodec = ["mediacodec"]
mediacodec = ["hwcodec"]

[[profiles]]
id = "android-arm64"
platform = "android"
rust_targets = ["aarch64-linux-android"]
abi = "arm64-v8a"
