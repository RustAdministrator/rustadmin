allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
// file_picker 11 applies the Kotlin Gradle plugin only below AGP 9 and relies on AGP 9's
// built-in Kotlin above it. Built-in Kotlin stays off here (android.builtInKotlin=false):
// desktop_drop, device_info_plus and other plugins still apply the Kotlin plugin themselves,
// which built-in Kotlin rejects. Flutter adds the Kotlin plugin to modules that lack it, but
// it finds the plugin's name in file_picker's build file and skips it, so file_picker's
// Kotlin sources were not compiled (FilePickerPlugin not found). Drop this once the plugins
// support built-in Kotlin.
subprojects { subproject ->
    if (subproject.name == 'file_picker') {
        subproject.pluginManager.withPlugin('com.android.library') {
            subproject.pluginManager.apply('org.jetbrains.kotlin.android')
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }
}
subprojects { subproject ->
    if (subproject.name != 'app') {
        subproject.afterEvaluate {
            if (subproject.plugins.hasPlugin('com.android.library')) {
                subproject.android.compileSdk = 36
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
